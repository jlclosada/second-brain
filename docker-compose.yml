services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://brain:brain@db:5432/brain
    ports:
      - "8000:8000"
    volumes:
      - brain-data:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://brain:brain@db:5432/brain
    volumes:
      - brain-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  # Tus documentos originales y el modelo de embeddings descargado
  brain-data:
